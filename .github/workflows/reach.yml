name: reach
on: workflow_dispatch
permissions: {}
jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -sS -m 20 -o /dev/null -w 'splib %{http_code} %{time_total}\n' 'https://www.splib.or.kr/intro/menu/10052/program/30014/eventList.do?eventStatusCd=apply' || echo 'splib failed'
          curl -sS -m 20 -o /dev/null -w 'spscc %{http_code} %{time_total}\n' 'https://www.spscc.or.kr/bbs/board.php?bo_table=s4_1_3_1&year=2026&month=11' || echo 'spscc failed'
