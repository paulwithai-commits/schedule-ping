name: ping
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call endpoint
        env:
          TARGET: ${{ secrets.TARGET_URL }}
          TOKEN: ${{ secrets.TARGET_TOKEN }}
          BYPASS: ${{ secrets.TARGET_BYPASS }}
        run: |
          curl -fsS -m 120 -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-vercel-protection-bypass: $BYPASS" \
            "$TARGET"
