name: ping
on:
  schedule:
    # 한국 시간 08:00~20:00. 밤에는 호출하지 않는다.
    - cron: '*/5 23 * * *'
    - cron: '*/5 0-10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call endpoint
        env:
          TARGET: ${{ secrets.TARGET_URL }}
          TOKEN: ${{ secrets.TARGET_TOKEN }}
          BYPASS: ${{ secrets.TARGET_BYPASS }}
        run: |
          curl -fsS -m 120 -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-vercel-protection-bypass: $BYPASS" \
            "$TARGET"
